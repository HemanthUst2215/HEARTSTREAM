# ADO User Story CSV Rulebook (permanent runtime contract)
# Bootstrap: derived once from workshop export WS-68405 during /generate-user-stories-from-transcript factory setup.
# Runtime agents MUST load this file only — never read or require the original bootstrap CSV.

schema_version: "1.0"
rulebook_id: "ado-user-story-csv-v1"
status: Active

provenance:
  behavior_id: RB-USCSV-001
  statement: Column layout, work item taxonomy, and narrative formats for ADO-compatible user story CSV export.
  source_path: "factory-setup"
  source_locator: "WS-68405.csv (one-time bootstrap; not a runtime input)"
  confidence: explicit

csv:
  encoding: utf-8
  delimiter: ","
  quote_char: '"'
  line_ending: "\n"
  include_header_row: true
  column_order:
    - ID
    - Work Item Type
    - Title
    - Description
    - Task Type1
    - MoM updated and attached
    - Action items identified and Tasks created
    - Related Feature identified and linked in ADO
    - SOW Annexure ID identified
    - Annexure ID1
    - Data Migration needs identified and Tasks created
    - Area Path
    - Start Date
    - Acceptance Criteria
    - Fit Gap Status

work_item_types:
  allowed:
    - Workshop
    - Epic
    - Feature
    - Test Case
    - User Story
    - Task
    - Issue
    - Risk
  transcript_output_default: User Story
  hierarchy:
    description: >
      Workshop (session container) → User Story (implementable requirement). Epic and Feature are not authored from the
      transcript; matching catalog Epic/Feature rows are inserted with their existing `ID` values.
      Task, Issue, and Risk are supporting ADO types when cited in transcript; do not invent them without transcript evidence.
    parent_linking:
      user_story_parent: Feature
      feature_parent: Epic
      note: "Mapping copies matched catalog Epic/Feature rows (with existing IDs) into the public Excel. Do not invent titles from the transcript."

title_formats:
  workshop: 'NN. <Domain> - <Workshop IDs> - <DD>/Mon/YYYY'
  epic: 'NN. <Epic name>'
  feature: 'N. <Feature name>'
  user_story: '<Short imperative capability title; no "As a user" prefix in Title>'
  task: '<Action item text>'
  issue: '<Issue short name>'
  risk: '<Risk short name>'

user_story:
  description_format:
    pattern: "As a <role>, I need to <need>, so that <benefit>."
    rules:
      - Role uses business language (e.g., account manager, user, partner operations).
      - Need states one testable capability; avoid stacking unrelated needs in one story.
      - Benefit states outcome for the business or user; cite transcript phrasing when possible.
      - May include HTML fragments only when transcript or approved glossary uses rich text; prefer plain text for new stories.
  title_vs_description:
    title: Capability headline only.
    description: Full user-story sentence(s); never duplicate Title-only content without the As-a/I-need/so-that structure.

acceptance_criteria:
  column: Acceptance Criteria
  format:
    - Use ASCII hyphen bullets: each line starts with "- " (hyphen + space).
    - Do not use Unicode bullet U+2022 (•) in new output.
    - One observable outcome per bullet; testable without implementation detail.
    - Prefer plain text; legacy bootstrap exports may have shown • or HTML; new output uses "- " only.
  placement: Acceptance Criteria column only — not embedded in Description for User Story rows.
  multiline_in_cell: true
  rule: >
    Put each criterion on its own line prefixed with "- " inside the Acceptance Criteria cell (RFC4180 quoted field).
    Do not concatenate all bullets into one line separated only by spaces.

transcript_authoring:
  create_from_transcript:
    - Workshop
    - User Story
    - Task
    - Issue
    - Risk
  do_not_create:
    - Epic
    - Feature
  note: >
    Identify the related catalog Feature from the transcript before authoring User Stories
    (AI Factory meeting 2026-10-07, Rajesh/Rajeev: the challenge is identifying the related feature,
    then each update to that workflow is a user story). Do not invent Feature titles.
    On the public Excel, every User Story `ID` is a catalog Feature workItemId.
    Leave it blank only when no catalog Feature title relates.
    Epic and Feature rows still carry their own catalog IDs. No EPIC ID / FEATURE ID columns.

ado_export_layout:
  row_order:
    - Workshop
    - Epic
    - Feature
    - Test Case
    - User Story
    - Issue
    - Risk
    - Task
  workshop_row:
    rule: First data row; Title matches workshop naming pattern; Area Path and Start Date populated when known.
  epic_feature_rows:
    rule: >
      Transcript working CSV has no Epic/Feature rows. The public Excel inserts matched catalog
      Epic then Feature rows (ID = workItemId, Title/Description from JSON) before User Stories.
  user_story_rows:
    area_path: leave blank unless transcript assigns a specific ADO area to the story
    description: Full As-a / I-need-to / so-that sentence only in Description
    acceptance_criteria: Bulleted lines in Acceptance Criteria column only
  issue_risk_rows:
    description: "Risk / Impact / Mitigation as separate lines in Description"
    acceptance_criteria: leave blank
    area_path: populate when workshop area is known (e.g. Day 2\CRM)

epic_and_feature:
  epic:
    description: Multi-line narrative of end-to-end process scope; may use newlines in Description cell (CSV-quoted).
  feature:
    description: >
      Structured narrative: Input / Activities / Output sections separated by semicolons or newlines as in reference export.
      Annexure ID1 populated when SOW annexure is cited.
    area_path_examples:
      - "Day 2\\Business E2E flow"
      - "Day 2\\CRM"

priority_conventions:
  present_in_reference_export: false
  rule: >
    Do not add Priority, MoSCoW, or Rank columns. Prioritization is expressed via workshop sequencing, Epic/Feature numbering,
    and human review — not via extra CSV columns.

story_point_conventions:
  present_in_reference_export: false
  rule: Do not add Story Points or Effort columns unless the rulebook is superseded by an approved harness decision.

fit_gap:
  column: Fit Gap Status
  usage: Populate when transcript or workshop notes state fit/gap disposition; otherwise leave empty.
  workshop_tasks: Action items may reference fit-gap updates in ADO; capture disposition in this column when stated.

workshop_governance_columns:
  yes_no_values: ["Yes", ""]
  columns:
    - MoM updated and attached
    - Action items identified and Tasks created
    - Related Feature identified and linked in ADO
    - SOW Annexure ID identified
    - Data Migration needs identified and Tasks created
  rule: Populate Yes only on Workshop rows when transcript explicitly confirms; leave blank for User Story rows unless transcript states otherwise.

task_type1:
  allowed_values:
    - Workshop Action item
    - QA
  rule: Populate only for Task rows when transcript classifies the action; leave blank for User Story rows.

area_path:
  format: 'Day 2\\<Area> or Day 2\\<Area>\\<Subarea>'
  examples:
    - "Day 2\\CRM"
    - "Day 2\\Business E2E flow"
    - "Day 2\\Testing\\CRM"
  rule: Use backslash as in ADO Area Path; match transcript module/workstream when stated.

start_date:
  format: "DD-MM-YYYY HH:MM"
  example: "28-09-2026 08:00"
  rule: Populate when transcript provides workshop or task schedule; otherwise leave blank.

required_fields:
  User Story:
    required: [Work Item Type, Title, Description, Acceptance Criteria]
    optional: [ID, Area Path, Fit Gap Status]
    area_path_default: empty
  Epic:
    required: [Work Item Type, Title, Description]
  Feature:
    required: [Work Item Type, Title, Description]
    optional: [Annexure ID1, Area Path]
  Test Case:
    required: [Work Item Type, Title, Description, Acceptance Criteria]
    optional: []
    id: leave blank
  Workshop:
    required: [Work Item Type, Title, Description, Area Path]
    optional: [Start Date, workshop_governance_columns]
  Task:
    required: [Work Item Type, Title]
    optional: [Task Type1, Area Path, Start Date, Description]
  Issue:
    required: [Work Item Type, Title, Description]
  Risk:
    required: [Work Item Type, Title, Description]

test_case:
  behavior_id: RB-TC-001
  statement: >
    Before test cases are written, requirements are taken from the transcript and matched to existing
    Feature records in artifacts/work-items/feature.json. A case is written only for a strong unique
    Feature match whose parent.workItemId exists in artifacts/work-items/epic.json. The CSV uses this
    rulebook's column_order. Traceability Transcript → Epic → Feature → Test Case is stored in the
    Test Case Description. No new columns.
  source_path: operator-instruction
  source_locator: "2026-10-08 test-agent: transcript match then CSV"
  confidence: explicit
  catalogs:
    epic_json: artifacts/work-items/epic.json
    feature_json: artifacts/work-items/feature.json
  match: >
    Score each transcript requirement against Feature title and description.plainText.
    Use work_item_mapping.strong_threshold and winner_margin from .cursor/config.yaml.
    Below threshold, ambiguous winner, or missing parent Epic → no Test Case for that requirement.
  row_rules:
    epic_feature: Copy ID, Title, Description, and Area Path from the matched JSON records. Do not invent titles or IDs.
    test_case_id: Leave ID blank.
    section_order: All Epic rows, then all matched Feature rows, then Test Case rows.
  description_format:
    pattern: |
      Transcript: <source_path>#<locator>
      Epic: <epic workItemId> | <epic title>
      Feature: <feature workItemId> | <feature title>
      Steps:
      1. <step cited from the transcript requirement or the matched Feature text>
    rules:
      - Steps and Acceptance Criteria come only from the transcript locator or the matched Feature title/description.
      - Do not add a step or expected result the transcript and Feature text do not support.
      - At least one numbered step.
  acceptance_criteria:
    format: Same ASCII "- " bullets as acceptance_criteria above. One expected outcome per line.
    placement: Acceptance Criteria column only.

id_column:
  column: ID
  rule: >
    Working CSV: leave User Story ID blank (ADO assigns a story id on import).
    Public Excel after mapping: set every User Story `ID` to a catalog Feature workItemId
    identified from the transcript. Leave it blank only when no catalog Feature title relates.
    Never fabricate an ID. Epic and Feature rows use their own catalog IDs.

formatting_standards:
  - RFC4180 CSV quoting; escape internal double quotes by doubling.
  - Preserve exact header spelling and column order from column_order.
  - No BOM on output unless operator import tool requires it (default no BOM).
  - Do not add or remove columns at runtime.

business_terminology:
  glossary_refs:
    - Partner / channel / PRM / ZINFI when cited in transcript
    - D365 CE and D365 F&O (Finance and Operations) for CRM/ERP boundaries
    - HeartStream region and legal entity
    - Fit-gap, MoM, SOW Annexure, WS-CE workshop identifiers
  rule: Use domain terms only when supported by transcript or approved glossary; register ASSUMPTION-xxx when inferring a term.

validation:
  script: scripts/validate-user-story-csv.py
  writer_script: scripts/ado_user_story_csv.py
  layout_module: scripts/ado_user_story_csv_layout.py
  regression_tests: scripts/test_ado_user_story_csv_layout.py
  rulebook_pointer: docs/intake/user-story-csv-rulebook.yaml
  mandatory_flow: >
    Agents must not hand-author CSV text. Persist row objects to JSON, then run
    `python scripts/ado_user_story_csv.py write --json <rows.json> --out <out.csv>`,
    then `python scripts/validate-user-story-csv.py --csv <out.csv>`. Exit non-zero blocks Done.

output_paths:
  working_csv: "artifacts/intake/.pipeline/<YYYY-MM-DD>-user-stories-working.csv"
  public_xlsx: "artifacts/intake/<YYYY-MM-DD>-user-stories-from-transcript.xlsx"
  invest_scorecard: "artifacts/intake/<YYYY-MM-DD>-invest-scorecard.csv"
  test_cases_csv: "artifacts/intake/<YYYY-MM-DD>-test-cases.csv"
  test_case_rows_json: "artifacts/intake/<YYYY-MM-DD>-test-case-rows.json"
  extraction_notes: "artifacts/intake/<YYYY-MM-DD>-transcript-story-extraction.md"
  validation_report: "artifacts/intake/<YYYY-MM-DD>-user-story-csv-validation.json"
