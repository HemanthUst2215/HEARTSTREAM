# Copy to config.yaml and fill placeholders. No product-specific module names.

project:
  name: "<project-name>"
  domain: "<bounded-context>"

modules:
  api: "<api-module-root>"
  ui: "<ui-module-root>"
  openapi: "contracts/openapi/<service>-v1.yaml"
  python: "<python-module-root>"   # optional
  infra: "infra/terraform"         # optional

intake:
  transcripts: artifacts/intake/transcripts/
  notes: artifacts/intake/
  supporting_docs: artifacts/intake/supporting/
  story_sources: docs/stories/

brd_drafts: artifacts/brd/
sprints: artifacts/sprints/
story_packs: docs/sprint<N>/userstory/

docs:
  feature_notes: docs/feature.md
  test_cases: docs/test-cases.md
  test_cases_br_coverage: docs/test-cases-br-coverage.md
  test_matrix: docs/test-matrix.md
  architecture_proposals: docs/architecture/
  adr: docs/architecture/
  harness_progress: docs/harness/progress.md
  harness_decisions: docs/harness/decisions.md

artifacts:
  work_items: artifacts/work-items/
  work_items_json: artifacts/work-items/work-items.json
  epic_json: artifacts/work-items/epic.json
  feature_json: artifacts/work-items/feature.json
  user_stories_dir: artifacts/user-stories/
  user_stories_csv: artifacts/user-stories/user-stories.csv
  invest_scorecard_csv: artifacts/user-stories/invest-scorecard.csv
  audit: artifacts/audit/
  application_summary_html: artifacts/application-summary.html
  application_summary_pdf: artifacts/application-summary.pdf
  test_results: artifacts/test-results-{date}.md
  e2e_test_results: artifacts/e2e-test-results-{timestamp}.md
  issue_logs: artifacts/issues/
  diagrams: artifacts/diagrams/

quality_gates:
  api_unit_line_coverage_min: 0.70
  api_unit_branch_coverage_target: 0.70
  ui_coverage_min: 0.70
  max_unwaived_high_cves: 0
  template_render_check: optional   # Agent-owned Java per docs/architecture/stack-conventions.md

execution:
  max_iterations: 3

pipeline:
  brd_command: generate-brd
  architecture_command: propose-architecture
  plan_commands: [plan-sprint]
  ui_design_command: generate-ui-design
  execute: [implement-api, implement-ui, expand-test-coverage, run-tests, run-eval, close-eval-gaps, review-changes, application-summary]
  eval_fix_command: close-eval-gaps

local_stack:
  api_health_url: "http://localhost:8080/actuator/health"
  ui_health_url: "http://localhost:3000"
  start_script: "scripts/run-local-stack.sh"
  verify_script: "scripts/verify-stack-health.sh"
  stop_script: "scripts/stop-local-stack.sh"

user_story_pipeline:
  story_command: generate-user-stories-from-transcript
  required_inputs:
    - transcript_path
    - mom_paths
    - prerequisite_paths
  draft_json: artifacts/user-stories/.pipeline/stories-draft.json
  export_script: scripts/generate-user-story-outputs.py
  out_dir: artifacts/user-stories
  work_items_dir: artifacts/work-items
  match_threshold: 50   # 0-100; calibrated on IDF-coverage scoring (see docs/user-story-generation/README.md)
  docx_extract_script: scripts/extract-docx-text.py
  mom_analyzer: mom-analyzer
  mom_normalized_text: artifacts/intake/.pipeline/<slug>-mom.txt

# Workshop prerequisite scope + MSD365 entity mapping for /generate-user-stories-from-transcript.
workshop_prerequisite_scope:
  rulebook: docs/intake/workshop-prerequisite-scope-rulebook.yaml
  skill: .cursor/skills/workshop-prerequisite-analysis/SKILL.md
  knowledge_base_json: artifacts/intake/<date>-workshop-prerequisite-knowledge-base.json
  knowledge_base_md: artifacts/intake/<date>-workshop-prerequisite-knowledge-base.md
  prerequisite_analyzer: workshop-prerequisite-analyzer
  scope_validate_script: scripts/validate-user-story-workshop-scope.py
  docx_extract_script: scripts/extract-docx-text.py
  required_input: prerequisite_paths

# MSD365 Business Entity allow-list for /generate-user-stories-from-transcript (Area Paths.xlsx → catalog JSON).
msd365_business_entity_scope:
  rulebook: docs/intake/msd365-business-entity-scope-rulebook.yaml
  catalog_json: docs/intake/msd365-business-entity-catalog.json
  bootstrap_xlsx: Area Paths.xlsx
  bootstrap_sheet: Details
  build_script: scripts/build-msd365-business-entity-catalog.py
  validate_script: scripts/validate-user-story-business-entity-scope.py
  regression_tests: scripts/test_msd365_business_entity_scope.py

# Feature mapping inside /generate-user-stories-from-transcript (SOW.json — no epic.json / feature.json).
work_item_mapping:
  command: generate-user-stories-from-transcript
  agent: work-item-mapping-agent
  work_items_dir: artifacts/work-items
  feature_source: sow_json
  sow_json: SOW.json
  map_script: scripts/map-user-stories-to-sow-features.py
  legacy_map_script: scripts/map-user-stories-to-work-items.py
  catalog_epic_json: null
  catalog_feature_json: null
  workshop_catalog_json: work-items.json
  strong_threshold: 62
  winner_margin: 8
  public_excel_layout: sow_feature_story_hierarchy
  max_related_features: 3
  workshop_context_min_overlap: 0
  require_both_epic_and_feature: false
  feature_row:
    title_2_format: "{annexure_minutes} - {topic}"
    description: topic
    id_column_blank: true
    annexure_id_column: Annexure ID1
    annexure_id_value: annexure_minutes
  public_xlsx: artifacts/intake/<date>-user-stories-from-transcript.xlsx
  invest_separate: artifacts/intake/<date>-invest-scorecard.csv

# Manual CSV vs AI-generated CSV, transcript as ground truth (/evaluate-user-stories).
user_story_evaluation:
  command: evaluate-user-stories
  agent: user-story-evaluation-agent
  rulebook: docs/intake/user-story-csv-rulebook.yaml
  metrics_contract: .cursor/templates/user-story-evaluation-metrics.yaml
  report_template: .cursor/templates/user-story-evaluation-report-template.md
  script: scripts/evaluate_user_stories.py
  allocate_run_script: scripts/evaluate_user_stories.py allocate-run
  new_run_only: true
  out_dir: artifacts/evaluation
  pipeline_dir: artifacts/evaluation/.pipeline
  public_html: artifacts/evaluation/<date>-user-story-evaluation[-slug][-vN].html
  public_json: artifacts/evaluation/<date>-user-story-evaluation[-slug][-vN].json
  # Jaccard floor proposes candidate pairs only (ASSUMPTION-USEVAL-003). It is not a match threshold.
  candidate_jaccard_floor: 0.28

# Independent source traceability HTML for manual and AI CSVs (/generate-html-for-user-stories).
user_story_source_analysis:
  command: generate-html-for-user-stories
  agent: user-story-evaluation-agent
  mode: source-traceability-html
  rulebook: docs/intake/user-story-csv-rulebook.yaml
  analysis_contract: .cursor/templates/user-story-source-analysis-contract.yaml
  report_template: .cursor/templates/user-story-source-analysis-report-template.md
  script: scripts/generate_user_story_source_analysis.py
  allocate_run_script: scripts/generate_user_story_source_analysis.py allocate-run
  new_run_only: true
  out_dir: artifacts/evaluation
  pipeline_dir: artifacts/evaluation/.pipeline
  sow_json: artifacts/work-items/SOW.json
  public_manual_html: artifacts/evaluation/<date>-manual-user-story-analysis[-slug][-vN].html
  public_manual_json: artifacts/evaluation/<date>-manual-user-story-analysis[-slug][-vN].json
  public_ai_html: artifacts/evaluation/<date>-ai-user-story-analysis[-slug][-vN].html
  public_ai_json: artifacts/evaluation/<date>-ai-user-story-analysis[-slug][-vN].json
  subagents:
    knowledge_base: source-knowledge-base-unifier
    analyzer: user-story-source-traceability-analyzer

# Transcript → matched Feature → rulebook test-case CSV (/expand-test-coverage).
test_case_pipeline:
  command: expand-test-coverage
  agent: test-agent
  mode: from-transcript
  epic_json: artifacts/work-items/epic.json
  feature_json: artifacts/work-items/feature.json
  rulebook: docs/intake/user-story-csv-rulebook.yaml
  rows_json: artifacts/intake/<date>-test-case-rows.json
  public_csv: artifacts/intake/<date>-test-cases.csv
  strong_threshold_ref: work_item_mapping.strong_threshold
  winner_margin_ref: work_item_mapping.winner_margin

# User Story Excel → MSD E2E workbook (/generate-test-cases-from-user-stories).
msd_test_case_pipeline:
  command: generate-test-cases-from-user-stories
  agent: test-agent
  mode: from-user-story-excel
  rulebook: docs/intake/msd-test-case-rulebook.yaml
  source_rulebook: docs/intake/user-story-csv-rulebook.yaml
  extract_script: scripts/msd_test_case_xlsx.py
  enrich_script: scripts/enrich-msd-source-stories.py
  coherence_module: scripts/msd_test_case_coherence.py
  coherence_regression: scripts/test_msd_test_case_coherence.py
  validate_script: scripts/validate-msd-test-case-xlsx.py
  layout_module: scripts/msd_test_case_xlsx_layout.py
  regression_tests: scripts/test_msd_test_case_xlsx_layout.py
  business_process_author: msd-test-case-business-process-author
  precondition_aligner: msd-test-case-precondition-aligner
  optional_inputs:
    consultant_story_excel: null
    clarification_paths: []
    workshop_prerequisite_kb: artifacts/intake/<date>-workshop-prerequisite-knowledge-base.json
    transcript_path: null
  out_dir: artifacts/intake
  enriched_stories_json: artifacts/intake/<date>-msd-source-stories-enriched.json
  public_xlsx: artifacts/intake/<date>-msd-e2e-test-cases.xlsx
  bootstrap_xlsx_not_runtime: true

mom_pipeline:
  command: generate-mom
  out_dir: artifacts/mom
  pipeline_dir: artifacts/mom/.pipeline
  output_docx: artifacts/mom/generated-mom.docx   # overwrite target; new runs use generated-mom-<timestamp>.docx
  output_path_script: scripts/mom-output-path.py  # exit 2 = ask new vs overwrite
  fill_script: scripts/fill-mom-template.py
  docx_extract_script: scripts/extract-docx-text.py

transcript_pipeline:
  generate_command: generate-transcript
  validate_command: validate-transcript
  out_dir: artifacts/transcript   # overwrite target is transcript.docx; new runs add transcript-<timestamp>.docx in this same folder
  output_path_script: scripts/transcript_pipeline/output_path.py   # exit 2 = ask new vs overwrite
  pipeline_dir: artifacts/transcript/.pipeline
  outputs:
    docx: artifacts/transcript/transcript.docx
    validation_report: artifacts/transcript/transcript_validation_report.md
    gap_analysis: artifacts/transcript/transcript_gap_analysis.md
    actions: artifacts/transcript/action_items.json
  scripts_dir: scripts/transcript_pipeline
  thresholds: scripts/transcript_pipeline/thresholds.json   # quality gates (single source of truth)
  terminology: scripts/transcript_pipeline/terminology.json
  supported_video: [mp4, mov, avi, mkv, webm]
  supported_audio: [wav, mp3, m4a, aac]
  engines:                       # optional; see requirements.txt
    ffmpeg: required for non-WAV input and noise reduction
    asr: faster-whisper | openai-whisper | --asr-json import
    diarization: local energy detection, or --diarization-json; HF_TOKEN is never read
  speaker_identification:
    agent: speaker-identification-agent
    validator: speaker-identification-validator-agent
    script: scripts/transcript_pipeline/identify_speakers.py
    schemas: scripts/transcript_pipeline/schemas
    anonymous_labels: Speaker_A
    participants: null

csv_pipeline:
  sample_csv: Workshop items.csv
  required_columns:
    - State
    - ID
    - Work Item Type
    - Title
    - Description
    - Parent
    - Related Link Count
    - Area Path
    - Iteration Path
  safety_scan_script: scripts/intake-safety-scan.py
  transform_script: scripts/csv-to-work-items-json.py

evals:
  root: evals/product
  rule_source: artifacts/brd/<module>-BRD.md   # or story pack path
  rule_id_pattern: "(FR|BR|NFR|INT)-[0-9]+"
  status: evals/product/STATUS.md
  results: evals/product/results/
  factory_root: evals/factory
  test_commands:
    api: "cd <api-module-root> && mvn test"
    ui: "cd <ui-module-root> && npm test"
    e2e: "cd <ui-module-root> && npm run test:e2e"
