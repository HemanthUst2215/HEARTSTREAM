# Template for docs/intake/msd-test-case-rulebook.yaml (copy and fill on bootstrap only)
# Bootstrap from an E2E test-execution workbook. Runtime loads the filled rulebook only.

schema_version: "1.0"
rulebook_id: "<msd-e2e-test-case-xlsx-vN>"
status: Active
platform: microsoft_dynamics

provenance:
  behavior_id: RB-MSDTC-001
  statement: "<what this rulebook governs>"
  source_path: "factory-setup"
  source_locator: "<setup_xlsx filename — one-time only>"
  confidence: explicit

input:
  source_rulebook: docs/intake/user-story-csv-rulebook.yaml
  accepted_suffixes: [".xlsx", ".csv"]
  required_bind_keys: [id, work_item_type, title]
  field_bind:
    id: ID
    work_item_type: Work Item Type
    title: Title
    description: Description
    acceptance_criteria: Acceptance Criteria
    area_path: Area Path
  field_bind_aliases:
    title: [Title, Title 3, Title 2, Title 1]
  title_resolution:
    by_work_item_type:
      User Story: [Title 3, Title, Title 2, Title 1]
      Feature: [Title 2, Title, Title 1, Title 3]
  grouping:
    numbering_prefix_patterns: []

workbook:
  sheets:
    coverage:
      name: "<coverage sheet name from bootstrap>"
    register:
      name: "<step-register sheet name from bootstrap>"
    isv_lookup:
      name: "<lookup sheet name from bootstrap>"
      visible: false
  styling:
    font_family: "Aptos Narrow"
    body_font_size: 12
    title_font_size: 18
    title_row_height: 24
    colors:
      title_band: "16324F"
      table_header: "2F75B5"
      metrics_header: "2F75B5"
      metrics_row: "EAF2F8"
      design_basis_row: "F3F6F8"
      on_dark: "FFFFFF"
    sheets:
      coverage:
        subtitle_font_size: 12
        table_header:
          mode: plain
        wrap_roles: []
        column_widths_by_header: {}
      register:
        subtitle_font_size: 10
        table_header:
          mode: branded
        column_widths_by_header: {}

columns:
  coverage:
    order: []  # exact bootstrap coverage headers
    roles: {}
  register:
    order: []  # exact bootstrap register headers
    roles: {}
    case_level_roles: []
    step_level_roles: []
    execution_roles: []
  isv_lookup:
    order: []
    roles: {}

id_patterns:
  test_case_id:
    pattern: "TC{scenario:02d}-{polarity}{seq:02d}"

generation:
  case_model:
    statement: "Business-process E2E positive case(s) and one evidenced exception/control case per group."
  business_process_e2e:
    min_steps_positive: 3
  precondition_step_coherence:
    statement: "Preconditions must establish state before Step 1."

validation:
  precondition_coherence:
    enabled: true
    severity: critical
  script: scripts/validate-msd-test-case-xlsx.py
  rulebook_pointer: docs/intake/msd-test-case-rulebook.yaml

output_paths:
  public_xlsx: "artifacts/intake/<YYYY-MM-DD>-msd-e2e-test-cases.xlsx"
