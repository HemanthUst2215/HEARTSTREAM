# Optional model routing matrix for the Cursor factory.
#
# Enable:  cp .cursor/model-routing.yaml.example .cursor/model-routing.yaml
# Disable: rm .cursor/model-routing.yaml   → Task spawns inherit the operator model picker
#
# Resolution (most specific wins):
#   overrides.subagents → overrides.agents → tier_by_command → tier_by_agent → defaults.unmatched
#
# Use Cursor Task `model` slugs only. Omit or delete this file to skip matrix routing.

schema_version: "1.0"
enabled: true

defaults:
  unmatched: inherit

tiers:
  reasoning:
    model: claude-opus-4-7-thinking-xhigh
  coding:
    model: composer-2.5-fast
  mechanical:
    model: gemini-3-flash

